    :root {
      --paper-white: #FBFBF9;
      --paper-bone: #F5F4F0;
      --paper-sand: #EAE7E1;
      --paper-surface: #F8F7F3;
      --ink-black: #161616;
      --ink-charcoal: #282828;
      --ink-muted: #73726E;
      --ink-faint: #A9A7A1;
      --ink-line: #E3E0D8;
      --accent-red: #B93829;
      --shadow-photo: 0 2px 10px -2px rgba(22, 22, 22, 0.05), 0 1px 3px 0 rgba(22, 22, 22, 0.03);
      --shadow-photo-lift: 0 16px 32px -8px rgba(22, 22, 22, 0.09), 0 4px 12px -2px rgba(22, 22, 22, 0.04);
      --shadow-polaroid: 0 4px 16px -3px rgba(22, 22, 22, 0.07), 0 2px 6px -1px rgba(22, 22, 22, 0.04);
      --bg-color: var(--paper-white);
      --text-color: var(--ink-black);
      --card-bg: #FFFFFF;
      --border-color: var(--paper-sand);
    }

    body.dark {
      --paper-white: #121212;
      --paper-bone: #1A1A1A;
      --paper-sand: #2B2B2B;
      --paper-surface: #1E1E1E;
      --ink-black: #ECEAE4;
      --ink-charcoal: #D8D6CE;
      --ink-muted: #8E8C86;
      --ink-faint: #5C5B56;
      --ink-line: #2E2E2E;
      --card-bg: #1B1B1B;
      --border-color: #2B2B2B;
      --shadow-photo: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-photo-lift: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .font-serif {
      font-family: 'Newsreader', 'Cormorant Garamond', Georgia, serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', Menlo, Monaco, "Courier New", monospace;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(115, 114, 110, 0.25);
      border-radius: 3px;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Top Navigation */
    header.frame-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      transition: background-color 0.3s ease;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      cursor: pointer;
      text-align: left;
      border: none;
      background: none;
      color: inherit;
    }

    .brand h1 {
      font-family: 'Newsreader', serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .brand p {
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--ink-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 6px 0;
      position: relative;
      transition: color 0.2s ease;
    }

    .nav-btn:hover {
      color: var(--ink-charcoal);
    }

    .nav-btn.active {
      color: var(--ink-black);
      font-weight: 500;
    }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background-color: var(--ink-black);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      padding: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .icon-btn:hover {
      color: var(--ink-black);
    }

    .btn-add {
      background-color: var(--ink-black);
      color: var(--paper-white);
      border: none;
      padding: 7px 14px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-add:active {
      transform: scale(0.97);
    }

    /* Mobile tabs */
    .mobile-tabs {
      display: none;
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
      padding: 8px 16px;
      gap: 20px;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .nav-links {
        display: none;
      }
      .mobile-tabs {
        display: flex;
      }
      .brand p {
        display: none;
      }
    }

    /* Main Container */
    main.app-main {
      flex: 1;
      width: 100%;
    }

    /* Photo Card Tactile Component */
    .photo-card {
      background: var(--card-bg);
      padding: 12px;
      box-shadow: var(--shadow-photo);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .photo-card:hover {
      transform: translateY(-4px) rotate(0deg) !important;
      box-shadow: var(--shadow-photo-lift);
      z-index: 10;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: var(--paper-bone);
    }

    /* Polaroid Component */
    .polaroid {
      background: var(--card-bg);
      padding: 12px 12px 32px 12px;
      box-shadow: var(--shadow-polaroid);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .polaroid:hover {
      transform: scale(1.02) rotate(0deg) !important;
      box-shadow: var(--shadow-photo-lift);
      z-index: 10;
    }

    .polaroid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      background: var(--paper-bone);
    }

    .polaroid-caption {
      margin-top: 12px;
      text-align: center;
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--ink-charcoal);
    }

    /* Paper Slip Note */
    .note-slip {
      background: var(--paper-surface);
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: var(--shadow-photo);
      max-width: 280px;
      transition: transform 0.3s ease;
    }

    .note-slip p {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-charcoal);
      white-space: pre-wrap;
    }

    /* Freeform Canvas */
    .board-canvas {
      position: relative;
      width: 100%;
      min-height: 780px;
      background-color: var(--paper-surface);
      overflow: hidden;
      user-select: none;
    }

    .board-element {
      position: absolute;
      cursor: move;
      transition: box-shadow 0.2s;
    }

    .board-element.selected {
      outline: 1.5px solid var(--ink-black);
      box-shadow: var(--shadow-photo-lift);
      z-index: 50 !important;
    }

    .board-controls-floating {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-photo-lift);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      white-space: nowrap;
      z-index: 60;
    }

    .board-controls-floating button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .board-controls-floating button:hover {
      color: var(--ink-black);
    }

    /* Modals & Drawers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-photo-lift);
      width: 100%;
      max-width: 600px;
      position: relative;
      animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Photo Viewer Fullscreen */
    .photo-viewer-fullscreen {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      color: #FFFFFF;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .viewer-img-wrap {
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-img-wrap img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    /* Toast */
    .frame-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink-black);
      color: var(--paper-white);
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      box-shadow: var(--shadow-photo-lift);
      z-index: 300;
      animation: slideUp 0.3s ease;
    }
  </style>
</head>

    /* Drag Physics for Board Elements */
    let isDragging = false;
    let dragElementId = null;
    let dragStart = { x: 0, y: 0, elX: 0, elY: 0 };

    function selectBoardElement(e, id) {
      e.stopPropagation();
      selectedBoardElementId = id;
      renderCurrentView();
    }

    function deselectBoardElement(e) {
      if (e.target.id === 'board-surface') {
        selectedBoardElementId = null;
        renderCurrentView();
      }
    }

    function startDragElement(e, id) {
      isDragging = true;
      dragElementId = id;
      const el = selectedBoard.elements.find(item => item.id === id);
      dragStart = { x: e.clientX, y: e.clientY, elX: el.x, elY: el.y };

      window.addEventListener('mousemove', onDragElement);
      window.addEventListener('mouseup', endDragElement);
    }

    function onDragElement(e) {
      if (!isDragging || !dragElementId) return;
      const canvas = document.getElementById('board-surface');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const deltaX = ((e.clientX - dragStart.x) / rect.width) * 100;
      const deltaY = ((e.clientY - dragStart.y) / rect.height) * 100;

      const el = selectedBoard.elements.find(item => item.id === dragElementId);
      if (el) {
        el.x = Math.max(2, Math.min(85, parseFloat((dragStart.elX + deltaX).toFixed(1))));
        el.y = Math.max(2, Math.min(85, parseFloat((dragStart.elY + deltaY).toFixed(1))));
        const domEl = document.getElementById(`el-${el.id}`);
        if (domEl) {
          domEl.style.left = `${el.x}%`;
          domEl.style.top = `${el.y}%`;
        }
      }
    }

    function endDragElement() {
      isDragging = false;
      dragElementId = null;
      window.removeEventListener('mousemove', onDragElement);
      window.removeEventListener('mouseup', endDragElement);
    }

    function toggleElementLock(e, id) {
      e.stopPropagation();
      const el = selectedBoard.elements.find(item => item.id === id);
      if (el) el.locked = !el.locked;
      renderCurrentView();
    }

    function rotateElement(e, id) {
      e.stopPropagation();
      const el = selectedBoard.elements.find(item => item.id === id);
      if (el) el.rotation = parseFloat((el.rotation + 1.5).toFixed(1));
      renderCurrentView();
    }

    function duplicateElement(e, id) {
      e.stopPropagation();
      const el = selectedBoard.elements.find(item => item.id === id);
      if (el) {
        const copy = JSON.parse(JSON.stringify(el));
        copy.id = `be-${Date.now()}`;
        copy.x += 4;
        copy.y += 4;
        copy.zIndex = selectedBoard.elements.length + 1;
        selectedBoard.elements.push(copy);
        selectedBoardElementId = copy.id;
        renderCurrentView();
      }
    }

    /* Mix Generative Algorithm (Rules 13 & 14: respects locked elements) */
    function runMix(preset = 'EDITORIAL') {
      const elCount = selectedBoard.elements.length;
      const cols = Math.max(2, Math.ceil(Math.sqrt(elCount)));

      selectedBoard.elements.forEach((el, index) => {
        if (el.locked) return; // LOCKED ELEMENTS STAY IN PLACE!

        const col = index % cols;
        const row = Math.floor(index / cols);
        const jitterX = (Math.random() - 0.5) * 16;
        const jitterY = (Math.random() - 0.5) * 16;

        el.x = Math.max(5, Math.min(80, parseFloat((12 + col * (76 / cols) + jitterX).toFixed(1))));
        el.y = Math.max(8, Math.min(80, parseFloat((10 + row * (68 / Math.ceil(elCount / cols)) + jitterY).toFixed(1))));
        el.rotation = parseFloat(((Math.random() - 0.5) * 4).toFixed(1));
      });

      renderCurrentView();
      showToast(`Mix applied: ${preset}`);
    }

    function renderAndDownloadCanvas(format = 'square') {
      const canvas = document.createElement('canvas');
      canvas.width = format === 'story' ? 1080 : 1200;
      canvas.height = format === 'story' ? 1920 : (format === 'landscape' ? 800 : 1200);
      const ctx = canvas.getContext('2d');

      // Warm paper ground
      ctx.fillStyle = '#FBFBF9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Frame signature
      ctx.fillStyle = '#73726E';
      ctx.font = '12px Inter, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.textAlign = 'center';
      ctx.fillText('FRAME · NOT A FEED. A FRAME.', canvas.width / 2, canvas.height - 32);

      // Download
      const link = document.createElement('a');
      link.download = `frame-board-${format}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      closeModals();
      showToast('Board image generated & downloaded');
    }

            </button>
          </div>
          <button onclick="closeModals()" style="width: 100%; margin-top: 16px; padding: 8px; background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink-muted);">CLOSE</button>
        </div>
      `;
    }

    function simulateAddPhoto() {
      showToast('Photograph added to private catalog');
    }

    function closeModals() {
      document.getElementById('quick-add-container').style.display = 'none';
      document.getElementById('share-modal-container').style.display = 'none';
    }

    // Keyboard ESC to close viewers or modals
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closePhotoViewer();
        closeModals();
      }
    });

    // Boot the application
    renderCurrentView();
  </script>
</body>
</html>
